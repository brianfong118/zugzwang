name: CI
on: [push, pull_request]

jobs:
  build-test:
    runs-on: ubuntu-latest
    # A broken time limit hangs a test instead of failing it; the default timeout is six hours.
    timeout-minutes: 20
    strategy:
      matrix:
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake -S engine -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - run: cmake --build build
      - run: ./build/zugzwang_tests "~[slow]"
        if: matrix.build_type == 'Debug'
      - run: ./build/zugzwang_tests
        if: matrix.build_type == 'Release'
      # Only this covers the shipped binary. Naming the shell adds pipefail, so a crash fails the step.
      - shell: bash
        run: |
          echo "perft 3" | ./build/zugzwang | grep -x "Nodes searched: 8902"
          ./build/zugzwang bench | tail -n 1 | grep -Ex "nodes [0-9]+ nps [0-9]+"

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Versions lay out the same code differently, so CI must match the local formatter.
      - run: pipx install clang-format==21.1.8
      - run: find engine -name '*.cpp' -o -name '*.h' | xargs -r clang-format --dry-run --Werror
